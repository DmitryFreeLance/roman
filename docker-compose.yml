services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: redline
      POSTGRES_USER: redline
      POSTGRES_PASSWORD: redline
    ports:
      - "5432:5432"
    volumes:
      - redline-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redline"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: ./bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/redline
      DATABASE_USER: redline
      DATABASE_PASSWORD: redline
    ports:
      - "8080:8080"

volumes:
  redline-db:
